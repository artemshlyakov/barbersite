name: Build and deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check build script
        run: node --check scripts/build.mjs
      - name: Build preview (noindex)
        run: npm run build
      - name: Verify generated preview
        run: |
          test -f dist/index.html
          test -f dist/en/index.html
          test -f dist/images/habib-portrait.webp
          test -f dist/assets/site.css
          test -f dist/assets/site.js
          grep -qi 'noindex' dist/index.html
          grep -qi 'noindex' dist/en/index.html
          touch dist/.nojekyll
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
