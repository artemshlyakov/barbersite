name: Validate HABIB BARBER static preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check both static pages and assets
        run: |
          set -e
          test -f index.html
          test -f en/index.html
          test -f styles.css
          test -f script.js
          test -f public/images/habib-portrait.webp
          test -f public/favicon.svg
          grep -q 'ТВОЙ СТИЛЬ' index.html
          grep -q 'YOUR STYLE' en/index.html
          grep -qi 'noindex' index.html
          grep -qi 'noindex' en/index.html
          echo 'Static design preview verified.'
      - name: Public Pages smoke test (wait for Pages deployment)
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          base="https://artemshlyakov.github.io/barbersite"
          for i in $(seq 1 24); do
            curl -fsSL --max-time 20 "${base}/" -o /tmp/habib-ru.html || true
            curl -fsSL --max-time 20 "${base}/en/" -o /tmp/habib-en.html || true
            if grep -q 'ТВОЙ СТИЛЬ' /tmp/habib-ru.html 2>/dev/null \
              && grep -q 'YOUR STYLE' /tmp/habib-en.html 2>/dev/null \
              && curl -fsSL --max-time 20 "${base}/styles.css" | grep -q 'Oswald'; then
              echo "The new RU/EN site and styles are published."
              exit 0
            fi
            echo "Awaiting published version (attempt ${i})"
            sleep 10
          done
          echo "::error::Public Pages is not showing new RU/EN site."
          exit 1
