name: Validate HABIB BARBER static preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check both static pages and assets
        run: |
          set -e
          test -f index.html
          test -f en/index.html
          test -f styles.css
          test -f script.js
          test -f assets/habib.webp
          test -f assets/favicon.svg
          grep -q 'ТВОЙ СТИЛЬ' index.html
          grep -q 'YOUR STYLE' en/index.html
          grep -qi 'noindex' index.html
          grep -qi 'noindex' en/index.html
          echo 'Static design preview verified.'
