<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" role="img" aria-labelledby="title desc">
<title id="title">Атмосфера старой цирюльни</title>
<desc id="desc">Стилизованный натюрморт с зелёным аптекарским флаконом, помазком и складной бритвой на тёмном фоне.</desc>
<defs>
