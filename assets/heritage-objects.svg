  <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#092923"/><stop offset=".17" stop-color="#285546"/><stop offset=".39" stop-color="#163d33"/><stop offset=".68" stop-color="#0d2c28"/><stop offset=".9" stop-color="#265247"/><stop offset="1" stop-color="#061b17"/></linearGradient>
  <linearGradient id="glassshine"><stop stop-color="#a4c3a2" stop-opacity=".52"/><stop offset=".15" stop-color="#fff" stop-opacity=".12"/><stop offset=".44" stop-color="#fff" stop-opacity=".015"/><stop offset="1" stop-color="#fff" stop-opacity=".10"/></linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#47321d"/><stop offset=".16" stop-color="#d5b881"/><stop offset=".4" stop-color="#765a32"/><stop offset=".7" stop-color="#bb985f"/><stop offset="1" stop-color="#372a19"/></linearGradient>
  <linearGradient id="razor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d1c3a8"/><stop offset=".3" stop-color="#7e8075"/><stop offset=".62" stop-color="#2e3431"/><stop offset="1" stop-color="#191e1b"/></linearGradient>
  <linearGradient id="bristles" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2c241c"/><stop offset=".52" stop-color="#a88d66"/><stop offset="1" stop-color="#d5c2a0"/></linearGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".5" fill="#e9d1a9" opacity=".07"/><circle cx="4" cy="3" r=".4" fill="#050908" opacity=".2"/></pattern>
</defs>
